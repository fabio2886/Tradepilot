<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TradePilot"><title>TradePilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d13;color:#edf2f7;font:14px system-ui,-apple-system,sans-serif}.app{min-height:100vh;display:flex}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#0b1017;border-right:1px solid #202b38;padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 22px}.logo{width:36px;height:36px;border-radius:9px;background:#63a4ff;color:#06101e;display:grid;place-items:center;font-weight:900}.brand small,.muted{color:#8d9aaa}.nav{display:block;width:100%;border:0;background:none;color:#8d9aaa;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0}.nav.active,.nav:hover{background:#172231;color:#fff}.foot{position:absolute;bottom:18px;left:12px;right:12px;border:1px solid #202b38;border-radius:10px;padding:12px;background:#0f151e}.mono{font-family:ui-monospace,monospace}.good{color:#36d399}.bad{color:#ff6b7a}.warn{color:#f5c76b}main{margin-left:235px;padding:28px;width:calc(100% - 235px);max-width:1500px}.title{font-size:24px;font-weight:700;margin-bottom:20px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#0f151e;border:1px solid #202b38;border-radius:12px;padding:17px;box-shadow:0 10px 30px #0003}.card h2{font-size:15px;margin:0 0 8px}.stat{min-height:110px}.label{font-size:12px;color:#8d9aaa}.value{font-size:24px;font-weight:700;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #202b38}.row:last-child{border:0}.badge{display:inline-block;border-radius:999px;padding:3px 7px;background:#192332;font-size:11px}.badge.good{background:#36d39918}.badge.bad{background:#ff6b7a18}.badge.warn{background:#f5c76b18}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:10px;border-bottom:1px solid #202b38}th{font-size:11px;color:#8d9aaa;text-transform:uppercase}.num{text-align:right}.btn{border:1px solid #202b38;background:#172231;color:#fff;border-radius:8px;padding:9px 12px}.primary{background:#63a4ff;color:#06101e;border-color:#63a4ff;font-weight:700}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:#8d9aaa;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #202b38;border-radius:8px;background:#0a1018;color:#fff}.result{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.result div{border:1px solid #202b38;background:#0b1119;border-radius:9px;padding:10px}.result b{display:block;margin-top:3px;font-size:17px}.mobile{display:none}.bottom{display:none}
@media(max-width:900px){.side{display:none}.mobile{display:flex;position:sticky;top:0;z-index:10;background:#090d13ee;border-bottom:1px solid #202b38;padding:12px 14px;justify-content:space-between}.app{display:block}main{margin:0;width:100%;padding:16px 14px 112px}.title{font-size:20px}.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;min-height:82px;background:#090d13f8;border-top:1px solid #202b38;z-index:20;padding:6px 2px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.bottom button{flex:1;min-width:0;background:none;border:0;color:#8d9aaa;padding:5px 1px 2px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button:first-line{font-size:22px}.bottom .bottomIcon{font-size:22px;line-height:1}.bottom .active{color:#63a4ff;font-weight:700}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">TP</div><div><b>TradePilot</b><br><small>Trading-Übersicht</small></div></div><div id="nav"></div><div class="foot"><div class="muted">Depot</div><div class="mono" style="font-size:18px;font-weight:700">€34,890</div><span class="good">+1,42 % heute</span></div></aside><header class="mobile"><b>TradePilot</b><span class="mono">€34,890</span></header><main><div class="title" id="title">Übersicht</div><div id="view"></div></main><div class="bottom" id="bottom"></div></div><script>
const sections=[['cockpit','Übersicht','◉'],['scanner','Aktien-Suche','⌁'],['plan','Trade planen','▣'],['backtest','Strategie testen','⌁'],['paper','Demohandel','◫'],['journal','Trading-Tagebuch','☷']];const stocks=[['AAPL','229.87','+1.24%','Aufwärts','Höhere Hochs / höhere Tiefs','Rücksetzer','230.50','224.80','244.00','2.37','Kaufen'],['MSFT','418.32','+0.62%','Aufwärts','Ausbruch','Ausbruch','420.00','409.50','445.00','2.38','Kaufen'],['NVDA','138.45','+2.87%','Aufwärts','Höhere Hochs / höhere Tiefs','Trendfortsetzung','139.20','132.00','156.00','2.33','Kaufen'],['AMD','162.18','-1.05%','Seitwärts','Range','Seitwärtsbewegung','158.00','152.50','172.00','2.55','Beobachten'],['TSLA','248.50','-2.31%','Abwärts','Tiefere Tiefs / tiefere Hochs','Umkehr','244.00','254.00','220.00','2.40','Verkaufen'],['META','585.10','+0.94%','Aufwärts','Höhere Hochs / höhere Tiefs','Rücksetzer','587.00','569.00','630.00','2.39','Kaufen'],['AMZN','201.42','+0.41%','Seitwärts','Range','Ausbruch','205.00','197.00','219.00','1.75','Beobachten'],['GOOGL','172.66','+1.53%','Aufwärts','Ausbruch','Ausbruch','173.50','167.00','188.00','2.23','Kaufen']];let trades=JSON.parse(localStorage.tpTrades||'null')||[{s:'NVDA',d:'Long',e:132.4,c:138.45,n:120},{s:'MSFT',d:'Long',e:409.8,c:418.32,n:30},{s:'TSLA',d:'Short',e:256,c:248.5,n:45}];let journal=JSON.parse(localStorage.tpJournal||'null')||[{s:'AAPL',r:2.05},{s:'AMD',r:-1},{s:'META',r:2.1},{s:'TSLA',r:2.28}];const eur=n=>'€'+(+n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
function setupNav(){nav.innerHTML=sections.map(x=>`<button class="nav" data-id="${x[0]}">${x[2]}&nbsp; ${x[1]}</button>`).join('');const mobileLabels={cockpit:'Übersicht',scanner:'Aktien',plan:'Trade',backtest:'Testen',paper:'Demo',journal:'Tagebuch'};bottom.innerHTML=sections.map(x=>`<button data-id="${x[0]}"><span class="bottomIcon">${x[2]}</span><span>${mobileLabels[x[0]]}</span></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>go(b.dataset.id))}function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}function cockpit(){return `<div class="grid g4"><div class="card stat"><div class="label">Depotwert</div><div class="value">€34,890</div><span class="good">+€1.420 diese Woche</span></div><div class="card stat"><div class="label">Tagesergebnis</div><div class="value good">+€486</div><span class="good">+1.42%</span></div><div class="card stat"><div class="label">Offene Trades</div><div class="value">${trades.length}</div><span class="muted">€12.400 verfügbares Kapital</span></div><div class="card stat"><div class="label">Risiko je Trade</div><div class="value">1.0%</div><span class="muted">€348 maximales Risiko</span></div></div><div class="grid g2" style="margin-top:16px">${card('Offene Positionsgrößeen',trades.map(t=>`<div class="row"><div><b>${t.s}</b> <span class="badge ${t.d==='Long'?'good':'bad'}">${t.d==='Long'?'Long (Kauf)':'Short (Verkauf)'}</span><div class="muted">${t.n} sh · ${eur(t.e)}</div></div><div class="mono">${eur(t.c)}<br><span class="${(t.c-t.e)*(t.d==='Long'?1:-1)>=0?'good':'bad'}">${eur((t.c-t.e)*(t.d==='Long'?1:-1)*t.n)}</span></div></div>`).join(''))}${card('Marktübersicht',['S&P 500 · 5.738,17 · +0,51 %','Nasdaq 100 · 20.009,87 · +0,89 %','Dow Jones · 42.313 · -0,14 %','Russell 2000 · 2.224,70 · +0,33 %','VIX · 16,42 · -3,12 %'].map(x=>`<div class="row">${x}</div>`).join(''))}</div><div class="grid g2" style="margin-top:16px">${card('Aktuelle Setups',['AAPL · Rücksetzer · 2,37 R','GOOGL · Ausbruch · 2,23 R','TSLA · Umkehr · 2,40 R','META · Rücksetzer · 2,39 R'].map(x=>`<div class="row">${x}<span class="badge good">Setup</span></div>`).join(''))}${card('Beobachtungsliste',['AAPL · 229,87 · +1,24 %','NVDA · 138,45 · +2,87 %','MSFT · 418,32 · +0,62 %','TSLA · 248,50 · -2,31 %','META · 585,10 · +0,94 %','AMD · 162,18 · -1,05 %'].map(x=>`<div class="row">${x}</div>`).join(''))}</div>`}
function scanner(){return `<div class="card"><div style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="Aktie oder Symbol suchen…" style="flex:1;padding:9px;border:1px solid #202b38;border-radius:8px;background:#0a1018;color:#fff"><button class="btn" onclick="fillScan()">Filtern</button></div><div class="scroll"><table><thead><tr><th>Symbol</th><th>Preis</th><th>Trend</th><th>Struktur</th><th>Setup</th><th>Einstieg</th><th>Stop-Loss</th><th>Kursziel</th><th>Chance/Risiko</th><th>Signal</th></tr></thead><tbody id="scan"></tbody></table></div></div>`}function fillScan(){let q=(document.getElementById('q')?.value||'').toUpperCase();scan.innerHTML=stocks.filter(x=>x[0].includes(q)).map(x=>`<tr><td><b>${x[0]}</b></td><td class="mono">${x[1]} <span class="${x[2][0]=='+'?'good':'bad'}">${x[2]}</span></td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td><td class="mono">${x[6]}</td><td class="mono bad">${x[7]}</td><td class="mono good">${x[8]}</td><td class="mono">${x[9]}R</td><td><span class="badge ${x[10]=='Kaufen'?'good':x[10]=='Verkaufen'?'bad':'warn'}">${x[10]}</span></td></tr>`).join('')}
function plan(){return `<div class="grid g2"><section class="card"><h2>Trade planen</h2><p class="muted">Risiko, Positionsgrößesgröße und Chance/Risiko automatisch berechnen.</p><div class="fields"><div class="field"><label>Depotgröße (€)</label><input id="a" type="number" value="34890"></div><div class="field"><label>Risiko (%)</label><input id="r" type="number" step=".1" value="1"></div><div class="field"><label>Einstieg (€)</label><input id="e" type="number" step=".01" value="230.50"></div><div class="field"><label>Stop-Loss (€)</label><input id="s" type="number" step=".01" value="224.80"></div><div class="field"><label>Kursziel (€)</label><input id="t" type="number" step=".01" value="244"></div><div class="field"><label>Richtung</label><select id="d"><option>Long (Kauf)</option><option>Short (Verkauf)</option></select></div></div><button class="btn primary" style="margin-top:14px" onclick="calc()">Berechnen</button><div class="result" id="res"></div></section>${card('Handelsregeln','<div class="row">Maximales Risiko <b>1.0%</b></div><div class="row">Minimales Chance/Risiko <b>2.0R</b></div><div class="row">Setups <b>Ausbruch / Rücksetzer</b></div><div class="row"><span class="muted">Demo-Daten – keine Anlageberatung</span></div>')}</div>`}function calc(){let A=+a.value,R=+r.value,E=+e.value,S=+s.value,T=+t.value,ra=A*R/100,dist=Math.abs(E-S),n=Math.floor(ra/dist),p=Math.abs(T-E)*n,rr=Math.abs(T-E)/dist;res.innerHTML=`<div>Risiko<b>${eur(ra)}</b></div><div>Stop-Abstand<b>${eur(dist)}</b></div><div>Positionsgröße<b>${n} Aktien</b></div><div>Gewinnpotenzial<b class="good">${eur(p)}</b></div><div>R:R<b>${rr.toFixed(2)}R</b></div><div>Richtung<b>${d.value}</b></div>`}
function backtest(){return `<div class="grid g4"><div class="card stat"><div class="label">Trefferquote</div><div class="value">58%</div></div><div class="card stat"><div class="label">Trades</div><div class="value">142</div></div><div class="card stat"><div class="label">Profitfaktor</div><div class="value">2.14</div></div><div class="card stat"><div class="label">Gesamtergebnis</div><div class="value good">+€9,890</div></div></div><div class="card" style="margin-top:16px"><h2>Kapitalentwicklung · EMA-Rücksetzer</h2><svg width="100%" height="230" viewBox="0 0 900 230" preserveAspectRatio="none"><polyline fill="none" stroke="#63a4ff" stroke-width="3" points="0,205 110,182 220,191 330,154 440,124 550,140 660,87 780,43 900,18"/><line x1="0" y1="215" x2="900" y2="215" stroke="#202b38"/></svg><span class="muted">Maximaler Rückgang -8,4 % · Durchschnitt +0,62 R · Demo</span></div>`}function paper(){return `<div class="card"><button class="btn primary" onclick="addTrade()">+ Demo-Trade</button><div class="scroll" style="margin-top:14px"><table><thead><tr><th>Symbol</th><th>Richtung</th><th>Entry</th><th>Aktuell</th><th>Anzahl</th><th>Ergebnis</th><th></th></tr></thead><tbody>${trades.map((t,i)=>{let p=(t.c-t.e)*(t.d==='Long'?1:-1)*t.n;return `<tr><td><b>${t.s}</b></td><td>${t.d==='Long'?'Long (Kauf)':'Short (Verkauf)'}</td><td>${eur(t.e)}</td><td>${eur(t.c)}</td><td>${t.n}</td><td class="${p>=0?'good':'bad'}">${eur(p)}</td><td><button class="btn" onclick="closeTrade(${i})">Schließen</button></td></tr>`}).join('')}</tbody></table></div></div>`}function addTrade(){let s=prompt('Aktie / Symbol','AAPL'),e=+prompt('Einstieg','230'),n=+prompt('Anzahl Aktien','20');if(s&&e&&n){trades.push({s:s.toUpperCase(),d:'Long',e,c:e,n});save();go('paper')}}function closeTrade(i){let t=trades.splice(i,1)[0];journal.unshift({s:t.s,r:0});save();go('paper')}function journalView(){let total=journal.reduce((a,x)=>a+x.r,0),wins=journal.filter(x=>x.r>0).length;return `<div class="grid g4"><div class="card stat"><div class="label">Erfasste Trades</div><div class="value">${journal.length}</div></div><div class="card stat"><div class="label">Trefferquote</div><div class="value">${Math.round(wins/journal.length*100)}%</div></div><div class="card stat"><div class="label">Gesamt-R</div><div class="value ${total>=0?'good':'bad'}">${total.toFixed(2)}R</div></div><div class="card stat"><div class="label">Durchschnittliches R je Trade</div><div class="value">${(total/journal.length).toFixed(2)}R</div></div></div><div class="card" style="margin-top:16px"><div class="scroll"><table><thead><tr><th>Symbol</th><th>R</th></tr></thead><tbody>${journal.map(x=>`<tr><td><b>${x.s}</b></td><td class="${x.r>=0?'good':'bad'}">${x.r>=0?'+':''}${x.r.toFixed(2)}R</td></tr>`).join('')}</tbody></table></div></div>`}function save(){localStorage.tpTrades=JSON.stringify(trades);localStorage.tpJournal=JSON.stringify(journal)}function go(id){document.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('active',b.dataset.id===id));title.textContent=sections.find(x=>x[0]===id)[1];view.innerHTML=id==='cockpit'?cockpit():id==='scanner'?scanner():id==='plan'?plan():id==='backtest'?backtest():id==='paper'?paper():journalView();if(id==='scanner')fillScan();if(id==='plan')calc()}setupNav();go('cockpit');
</script></body></html>
